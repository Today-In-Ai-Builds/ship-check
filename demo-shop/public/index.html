<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Tiny Shop</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main>
    <h1>Tiny Shop</h1>
    <ul id="products"></ul>
    <section id="cart" aria-label="Cart">
      <h2>Cart</h2>
      <ul id="cart-items"></ul>
      <form id="discount">
        <label for="code">Discount code</label>
        <input id="code" name="code" placeholder="SAVE10">
        <button type="submit">Apply code</button>
      </form>
      <p>Total: <output id="total" aria-label="Total">$0.00</output></p>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
