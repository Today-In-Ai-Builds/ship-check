<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 420px; font-family: "Segoe UI", system-ui, sans-serif;
         background: radial-gradient(circle at 85% 20%, #2b3a2f 0, #121512 55%); color: #f3f1ea;
         display: flex; flex-direction: column; justify-content: center; padding: 0 84px; }
  .tag { font: 600 15px/1 "Cascadia Mono", Consolas, monospace; letter-spacing: .14em; color: #9fd3a8; }
  h1 { font-size: 92px; font-weight: 800; letter-spacing: -.03em; margin: 18px 0 10px; }
  h1 span { color: #9fd3a8; }
  p { font-size: 25px; color: #c9c6bb; max-width: 900px; line-height: 1.35; }
  .chips { display: flex; gap: 14px; margin-top: 34px; }
  .chip { font: 600 16px/1 "Cascadia Mono", Consolas, monospace; padding: 12px 16px; border-radius: 10px;
          background: #1e241f; border: 1px solid #34413a; color: #e7e4da; }
  .chip b { color: #9fd3a8; font-weight: 700; }
  .light { position: absolute; right: 96px; top: 110px; display: flex; flex-direction: column; gap: 14px; }
  .light i { width: 44px; height: 44px; border-radius: 50%; display: block; background: #2a2f2b; }
  .light i.red { background: #e35d4f; box-shadow: 0 0 34px #e35d4f88; }
  .light i.green { background: #3fbf6b; opacity: .25; }
</style></head><body>
  <div class="light"><i class="red"></i><i></i><i class="green"></i></div>
  <div class="tag">PULL REQUEST GATE</div>
  <h1>Ship <span>Check</span></h1>
  <p>Every pull request gets plain-English browser tests, a root-cause diagnosis when one fails, and a senior engineer's review, in one comment.</p>
  <div class="chips">
    <div class="chip"><b>e2e</b> · browser tests</div>
    <div class="chip"><b>Matt Pocock</b> · diagnosing-bugs</div>
    <div class="chip"><b>Ponytail</b> · review</div>
  </div>
</body></html>
